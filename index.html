<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pneutrack</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%232563eb' stroke-width='3'/%3E%3Cpath d='M16 9 L22 20 H10 Z' fill='none' stroke='%232563eb' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="brand">Pneutrack <button id="app-version" class="version" data-act="whats-new" title="Novità di questa versione"></button> <span id="doc-name"></span></div>
    <div class="group">
      <button data-act="projects" class="primary" title="Apri, rinomina, duplica o elimina i progetti">Progetti</button>
      <button data-act="new" title="Nuovo schema">Nuovo</button>
      <button data-act="save" title="Salva il progetto (Ctrl+S)">Salva</button>
      <button data-act="save-as" title="Salva una copia (Ctrl+Maiusc+S)">Salva copia</button>
      <button data-act="export" title="Scarica lo schema come file .pneu.json">Esporta</button>
      <button data-act="pdf" title="Scarica il foglio di disegno in PDF">PDF</button>
      <select id="examples" aria-label="Esempi"><option value="">Esempi…</option></select>
    </div>
    <span id="save-state" class="save-state" role="status"></span>
    <div class="group">
      <button id="btn-undo" data-act="undo" title="Annulla (Ctrl+Z)">↶ Annulla</button>
      <button id="btn-redo" data-act="redo" title="Ripeti (Ctrl+Y)">↷ Ripeti</button>
      <button id="btn-cut" data-act="cut" title="Taglia la selezione (Ctrl+X)">Taglia</button>
      <button id="btn-copy" data-act="copy" title="Copia la selezione (Ctrl+C)">Copia</button>
      <button id="btn-paste" data-act="paste" title="Incolla (Ctrl+V): sotto il puntatore, o accanto all'originale">Incolla</button>
      <button data-act="fit" title="Adatta la vista (F)">Adatta vista</button>
      <details id="view-filter" class="menu">
        <summary title="Scegli cosa mostrare nell'area di lavoro">Mostra ▾</summary>
        <div class="menu-body" id="view-filter-body"></div>
      </details>
    </div>
    <div class="group sim-controls">
      <button id="btn-sim" data-act="sim" class="sim-toggle" title="Anima lo schema e prova i comandi delle valvole">▶ Simula</button>
      <span id="sim-bar" class="group" hidden>
        <button id="btn-play" data-act="sim-play" title="Pausa / avvia (barra spaziatrice)">⏸ Pausa</button>
        <button data-act="sim-reset" title="Riporta lo schema allo stato iniziale">⟲ Ricomincia</button>
        <select id="sim-speed" aria-label="Velocità della simulazione">
          <option value="0.05">0,05×</option>
          <option value="0.1">0,1×</option>
          <option value="0.25" selected>0,25×</option>
          <option value="0.5">0,5×</option>
          <option value="1">1× tempo reale</option>
        </select>
        <span id="sim-time" class="sim-time">t = 0,00 s</span>
      </span>
    </div>
    <div id="status" class="status ok" role="status">…</div>
    <input type="file" id="file-input" accept=".json,application/json" hidden>
  </header>

  <aside id="palette" aria-label="Componenti"></aside>

  <main id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="Foglio dello schema">
      <defs>
        <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="0" cy="0" r="0.9" class="grid-dot"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid-pattern)" class="sheet"/>
      <g id="viewport">
        <g id="sheet"></g>
        <g id="blocks"></g>
        <g id="lines"></g>
        <polyline id="temp-wire" class="temp-wire" style="display:none"/>
        <rect id="marquee" class="marquee" style="display:none"/>
        <g id="components"></g>
        <g id="lines-top"></g>
        <g id="labels"></g>
        <g id="ports"></g>
      </g>
    </svg>
    <div id="legend" aria-label="Legenda"></div>
  </main>

  <aside id="side">
    <section id="properties" aria-label="Proprietà"></section>
    <section id="issues-panel" aria-label="Validazione">
      <h2>Validazione</h2>
      <ul id="issues"></ul>
    </section>
  </aside>
  <div id="projects-dialog" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="projects-title">
      <header>
        <h2 id="projects-title">Progetti</h2>
        <button data-dact="close" class="icon" aria-label="Chiudi">✕</button>
      </header>
      <p id="projects-store" class="store-label"></p>
      <div class="dialog-bar">
        <input id="projects-search" type="search" placeholder="Cerca per nome" aria-label="Cerca progetti">
        <button data-dact="save-current">Salva lo schema aperto</button>
        <button data-dact="new">Nuovo progetto</button>
        <button data-dact="import">Importa file…</button>
      </div>
      <ul id="projects-list"></ul>
    </div>
  </div>
  <div id="news-dialog" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="news-title">
      <header>
        <h2 id="news-title">Novità</h2>
        <button data-nact="close" class="icon" aria-label="Chiudi">✕</button>
      </header>
      <div id="news-body" class="news"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
