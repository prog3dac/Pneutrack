[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pneutrack"
version = "0.1.0"
description = "Disegno e simulazione di schemi pneumatici"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pneutrack-gui = "pneutrack.gui.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pneutrack.gui" = ["static/*", "static/**/*"]
"pneutrack.examples" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
